name: Instagram Daily Post

on:
  # 自動実行は停止中。投稿は workflow_dispatch で手動トリガー。
  # 再開する場合は schedule: 配下の cron を有効化する。
  schedule:
    # 2026-05-07 17:00 JST = 08:00 UTC の item 105 用 (一時。投稿後に削除すること)
    - cron: "0 8 7 5 *"
  workflow_dispatch:

permissions:
  contents: write  # 投稿履歴をコミットするため

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_to_instagram.py

      - name: Commit post history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram/posted/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: log Instagram post $(date -u +%Y-%m-%d)"
            git push
          fi
